<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha de Contrato – Pós-Obra</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#667;--bd:#d9dde3;--ac:#0f766e;--ac2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2327;--tx:#eceff2;--mu:#9aa4ae;--bd:#333b42;--ac:#2dd4bf;--ac2:#06201d}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1e2327;--tx:#eceff2;--mu:#9aa4ae;--bd:#333b42;--ac:#2dd4bf;--ac2:#06201d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 2px}
p.s{color:var(--mu);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:1rem;margin:0 0 10px}
label{display:block;font-size:.85rem;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.chk label{display:flex;align-items:center;gap:6px;margin:0;color:var(--tx);font-size:.95rem}
.chk input{width:auto}
.tip{border:1px dashed var(--ac);border-radius:10px;padding:12px;margin-bottom:10px}
.tip h3{margin:0 0 4px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;background:var(--ac);color:var(--ac2);font-weight:600}
button.o{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.x{background:transparent;color:#d33;padding:2px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{flex:1;min-width:140px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;font:.9rem/1.5 ui-monospace,Menlo,monospace;margin:0 0 10px}
#tot{font-weight:600;color:var(--ac)}
.cover{background:#1f3350;border-radius:14px;padding:22px 16px;text-align:center;margin:8px 0 16px}.cover img{width:150px;height:150px;border-radius:10px;display:block;margin:0 auto 12px}.cover h1{color:#fff;margin:0;font-size:1.3rem}.cover p{color:#b9c8dc;margin:4px 0 0}
</style>
</head>

<div class="row" style="margin-top:12px">
<button onclick="send('w')">Enviar por WhatsApp</button>
<button class="o" onclick="send('m')">Enviar por e-mail</button>
<button class="o" onclick="cp()">Copiar resumo</button>
</div>
</div>
</main>

<script>
let n=0;
const $=id=>document.getElementById(id);
function addTip(){
 n++;
 const d=document.createElement('div');d.className='tip';d.dataset.id=n;
 d.innerHTML=`<h3><span>Tipo <b class="num"></b></span><button class="x" onclick="this.closest('.tip').remove();upd()">remover</button></h3>
 <div class="g">
 <div><label>Quantidade de APs</label><input class="q" type="number" min="0" inputmode="numeric"></div>
 <div><label>Tamanho (m²)</label><input class="m" type="number" min="0" step="0.01" inputmode="decimal"></div>
 <div><label>Quartos</label><input class="r" type="number" min="0" inputmode="numeric"></div>
 <div><label>Banheiros</label><input class="b" type="number" min="0" inputmode="numeric"></div>
 </div>
 <div class="chk">
 <label><input type="checkbox" class="v"> Possui varanda</label>
 <label><input type="checkbox" class="l"> Já vem com luminária</label>
 <label><input type="checkbox" class="x2"> Já vem com box</label>
 </div>`;
 d.addEventListener('input',upd);d.addEventListener('change',upd);
 $('tips').appendChild(d);upd();
}
function tips(){
 return [...document.querySelectorAll('.tip')].map((t,i)=>{
  t.querySelector('.num').textContent=i+1;
  return {q:+t.querySelector('.q').value||0,m:t.querySelector('.m').value,r:t.querySelector('.r').value,b:t.querySelector('.b').value,
   v:t.querySelector('.v').checked,l:t.querySelector('.l').checked,x:t.querySelector('.x2').checked};
 });
}
const sn=v=>v?'Sim':'Não';
function txt(){
 const t=tips(),tot=t.reduce((a,c)=>a+c.q,0);
 $('tot').textContent=tot;
 let s=`*NOVO CONTRATO PÓS-OBRA – CONCEITO SOLUÇÕES*\nObra: ${$('obra').value||'-'}\nCNPJ: ${$('cnpj').value||'-'}\nFechado por: ${$('resp').value||'-'}\nTotal de APs: ${tot}\n`;
 t.forEach((c,i)=>{s+=`\nTipo ${i+1}: ${c.q} AP(s) de ${c.m||'-'} m²\n- Quartos: ${c.r||'-'}\n- Banheiros: ${c.b||'-'}\n- Varanda: ${sn(c.v)}\n- Luminária inclusa: ${sn(c.l)}\n- Box incluso: ${sn(c.x)}\n`});
 if($('obs').value.trim())s+=`\nObs.: ${$('obs').value.trim()}\n`;
 return s;
}
function upd(){$('out').textContent=txt()}
$('cnpj').addEventListener('input',e=>{
 let v=e.target.value.replace(/\D/g,'').slice(0,14);
 v=v.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2');
 e.target.value=v;
});
['obra','cnpj','resp','obs'].forEach(i=>$(i).addEventListener('input',upd));
function send(k){
 const s=txt();
 if(k==='w'){let z=$('zap').value.replace(/\D/g,'');if(z&&z.length<=11)z='55'+z;window.open('https://wa.me/'+z+'?text='+encodeURIComponent(s),'_blank')}
 else window.location.href='mailto:'+$('mail').value+'?subject='+encodeURIComponent('Contrato pós-obra - '+($('obra').value||''))+'&body='+encodeURIComponent(s.replace(/\*/g,''));
}
async function cp(){try{await navigator.clipboard.writeText(txt().replace(/\*/g,''));alert('Resumo copiado!')}catch(e){alert('Selecione e copie o texto manualmente.')}}
addTip();
</script>
</body>
</html>
